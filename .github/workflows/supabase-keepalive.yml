name: Supabase Keepalive

# This action runs a cron job to keep the Supabase free-tier project from pausing
# by making a lightweight API request every 3 days.

on:
  schedule:
    # Run at 00:00 on every 3rd day-of-month
    - cron: '0 0 */3 * *'
  # Allow running this action manually from the Actions tab
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.VITE_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Error: VITE_PUBLIC_SUPABASE_URL and VITE_PUBLIC_SUPABASE_ANON_KEY secrets must be set in GitHub repository settings."
            exit 1
          fi
          
          echo "Pinging Supabase to prevent project pause..."
          
          # We ping a standard health-check endpoint or a generic REST endpoint. 
          # Pinging the root /rest/v1/ is extremely lightweight and counts as API activity.
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "${SUPABASE_URL}/rest/v1/")
            
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 400 ] || [ "$HTTP_STATUS" -eq 404 ]; then
            echo "Successfully reached Supabase API. (Status: $HTTP_STATUS)"
          else
            echo "Failed to reach Supabase API. Unexpected status: $HTTP_STATUS"
            exit 1
          fi
